# CI for a Go service: runs `just ci` on every pull request, and builds the
# image of every merge. A merge deploys when its pull request has the label "deploy": see deploy.yml.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [$default-branch]

# A new push to a pull request cancels its running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Runs the repo's own checks, the same ones a person runs with `just ci`.
  # Extras that only this repo needs, such as a service container, go here.
  check:
    name: Checking the code
    # Runs unless the pull request is a draft, or the run comes from a label
    # other than push-image.
    if: >-
      github.event.pull_request.draft != true &&
      (github.event.action != 'labeled' || github.event.label.name == 'push-image')
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checking out the code
        uses: actions/checkout@v7

      # A self-hosted runner keeps the Go caches on its disk, so only
      # GitHub-hosted runners use the GitHub cache.
      - name: Setting up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Setting up just
        uses: extractions/setup-just@v4

      - name: Running the checks
        run: just ci

  image:
    name: Building the image
    needs: check
    # Runs when no check failed, and not for a draft pull request.
    if: github.event.pull_request.draft != true && !failure() && !cancelled()
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    uses: probe-lab/.github/.github/workflows/image.yml@v2
    with:
      service: ${{ github.event.repository.name }}

  # Deploys the merge after its image exists, when its pull request has the
  # label "deploy". Delete this job in a repo that never deploys, and
  # deploy.yml with it.
  deploy:
    name: Deploy
    needs: image
    # image.yml sets the output deploy when a merge had the label deploy. Any
    # other run, such as a pull request, skips this job.
    if: needs.image.outputs.deploy
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
