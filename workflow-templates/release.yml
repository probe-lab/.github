# Releases a version tag. Write the changes under "## [1.2.3]" in
# CHANGELOG.md, merge them, wait for CI, then push the tag:
# `git tag v1.2.3 && git push origin v1.2.3`. The release fails unless CI
# passed for the tagged commit. To retry a release, rerun the failed jobs of
# its run.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Releasing
    permissions:
      contents: write
      checks: read
      id-token: write
    uses: probe-lab/.github/.github/workflows/release.yml@v2
    with:
      tag: ${{ github.ref_name }}
      # ecr-service: SERVICE
