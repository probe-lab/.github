# The Deploy workflow: deploys the image of one commit to ECS. Save it as
# .github/workflows/deploy.yml.
#
# It starts in 2 ways:
#   - A person starts it from the Actions tab, or with
#     `gh workflow run deploy.yml -f commit=<commit>`. It deploys without a
#     check. To roll back, deploy an older commit.
#   - ci.yml calls it after the image job of a merge. It deploys only when the
#     merged pull request has the label "deploy".
# A repo without this file never deploys.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to deploy. Empty means the newest on the default branch.
        type: string
        required: false
  workflow_call:

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  deploy:
    name: Deploying
    uses: probe-lab/.github/.github/workflows/deploy-ecs.yml@v2
    with:
      service: ${{ github.event.repository.name }}
      commit: ${{ inputs.commit }}
      # Replace SERVICE with the names in probelab-infra.
      cluster: prod-use1-cmi-ecs-cluster
      ecs-service: prod-use1-cmi-SERVICE
      task-definition: prod-use1-cmi-SERVICE-task
      container: prod-use1-cmi-SERVICE
    secrets: inherit
