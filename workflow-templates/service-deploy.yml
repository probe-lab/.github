# The Deploy button: deploys the image of one commit to ECS. Start it from
# the Actions tab, or with `gh workflow run deploy.yml -f commit=<commit>`.
# ci.yml also calls it after a merge whose pull request has the label
# "deploy". Save it as .github/workflows/deploy.yml.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to deploy. Empty means the newest on the default branch.
        type: string
        required: false
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      pr-label:
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  deploy:
    uses: probe-lab/.github/.github/workflows/deploy-ecs.yml@v1
    with:
      service: ${{ github.event.repository.name }}
      commit: ${{ inputs.commit }}
      pr-label: ${{ inputs.pr-label }}
      # Replace SERVICE with the names in probelab-infra.
      cluster: prod-use1-cmi-ecs-cluster
      ecs-service: prod-use1-cmi-SERVICE
      task-definition: prod-use1-cmi-SERVICE-task
      container: prod-use1-cmi-SERVICE
    secrets: inherit
