# Deploys the image of one commit to one ECS service. Two events start it in
# the caller: a person pressing the Deploy button (workflow_dispatch), and a
# finished CI run on the default branch (workflow_run). The button deploys
# without a check. A CI run deploys only when the merged pull request of the
# commit has the label deploy. See the README for an example call.
#
# It deploys only a commit on the default branch whose image
# <service>-sha<commit> is in ECR. It never builds an image: while CI still
# builds it, the deploy waits up to 10 minutes. The caller grants
# contents: read, id-token: write and pull-requests: read.
name: Deploy to ECS

on:
  workflow_call:
    inputs:
      service:
        description: The first part of the image tag, for example atlas.
        type: string
        required: true
      commit:
        description: The commit to deploy. Empty means the newest on the default branch.
        type: string
        default: ""
      cluster:
        description: The ECS cluster, for example prod-use1-web-ecs-cluster.
        type: string
        required: true
      ecs-service:
        description: >-
          The ECS service, for example prod-use1-web-atlas-service. Empty
          only with task-definition-only.
        type: string
        default: ""
      task-definition:
        description: The task definition family, for example prod-use1-web-atlas-task.
        type: string
        required: true
      container:
        description: The container that gets the new image, for example prod-use1-web-atlas.
        type: string
        required: true
      container-env:
        description: Environment variables to set in the container, one KEY=VALUE per line.
        type: string
        default: ""
      task-definition-only:
        description: >-
          Registers the new task definition but deploys no service, for
          tasks that something else starts.
        type: boolean
        default: false
    outputs:
      commit:
        description: The full commit that was deployed.
        value: ${{ jobs.deploy.outputs.commit }}
      image:
        description: The image that was deployed.
        value: ${{ jobs.deploy.outputs.image }}
      task-definition-arn:
        description: The new task definition.
        value: ${{ jobs.deploy.outputs.task-definition-arn }}

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::019120760881:role/prod-use1-github-oidc-role
  ECR_REGISTRY: 019120760881.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: probelab
  # CI pushes the image after the tests pass. A deploy started right after a
  # merge waits that long for it.
  IMAGE_WAIT_MINUTES: 10
  SERVICE_WAIT_MINUTES: 15

jobs:
  # A separate job, so that a merge without the label creates no deployment
  # in GitHub. The button skips it.
  label:
    name: Check the pull request label
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.label.outputs.deploy }}
    steps:
      - name: Checking the pull request
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          LABEL: deploy
        run: |
          set -euo pipefail
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls" | jq -r --arg label "$LABEL" \
            '[.[] | select(.merged_at != null and any(.labels[]; .name == $label)) | "#\(.number)"] | join(", ")')
          if [[ -n "$prs" ]]; then
            echo "Pull request $prs has the label $LABEL. Deploying ${SHA::7}."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No merged pull request of ${SHA::7} has the label $LABEL. Nothing deploys."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy ${{ inputs.ecs-service || inputs.task-definition }}
    needs: label
    # Runs when there is no label to check, or when the pull request has it.
    if: ${{ !cancelled() && (needs.label.result == 'skipped' || needs.label.outputs.deploy == 'true') }}
    # Deploys hold prod credentials, so they never run on a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # One rollout at a time for each service. A newer deploy waits, and an
    # older deploy that still waits is dropped.
    concurrency:
      group: deploy-${{ inputs.cluster }}-${{ inputs.ecs-service || inputs.task-definition }}
      cancel-in-progress: false
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      image: ${{ steps.image.outputs.image }}
      task-definition-arn: ${{ steps.service.outputs.task-definition-arn || steps.register.outputs.task-definition-arn }}
    steps:
      - name: Finding the commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          COMMIT: ${{ github.event.workflow_run.head_sha || inputs.commit }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/commits/${COMMIT:-$DEFAULT_BRANCH}" --jq .sha)
          # "behind" means the commit is an ancestor of the default branch.
          status=$(gh api "repos/$REPO/compare/$DEFAULT_BRANCH...$sha" --jq .status)
          if [[ "$status" != "identical" && "$status" != "behind" ]]; then
            echo "::error::Commit $sha is not on $DEFAULT_BRANCH. Merge it first."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"

      - name: Configuring AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE }}

      # CI pushes the image after the tests pass. A deploy started right
      # after a merge waits for it.
      - name: Finding the image
        id: image
        env:
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          SERVICE: ${{ inputs.service }}
          SHA: ${{ steps.commit.outputs.sha }}
          WAIT_MINUTES: ${{ env.IMAGE_WAIT_MINUTES }}
        run: |
          tag="$SERVICE-sha${SHA::7}"
          deadline=$((SECONDS + WAIT_MINUTES * 60))
          until aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$tag" > /dev/null 2> ecr-error.txt; do
            if ! grep -q ImageNotFoundException ecr-error.txt; then
              echo "::error::$(cat ecr-error.txt)"
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::There is no image $tag after $WAIT_MINUTES minutes. Check that the CI run of this commit on the default branch passed."
              exit 1
            fi
            echo "$tag is not in ECR yet. CI may still be running. Checking again in 20 s."
            sleep 20
          done
          echo "image=$IMAGE:$tag" >> "$GITHUB_OUTPUT"

      # Takes the newest task definition, so a change that Terraform made to
      # it, such as a new environment variable, goes out with this deploy.
      - name: Downloading the task definition
        id: current
        env:
          FAMILY: ${{ inputs.task-definition }}
          CONTAINER: ${{ inputs.container }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition > current.json
          image=$(jq -r --arg c "$CONTAINER" '.containerDefinitions[] | select(.name == $c) | .image' current.json)
          if [[ -z "$image" ]]; then
            echo "::error::The task definition $FAMILY has no container $CONTAINER."
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          jq 'del(.taskDefinitionArn, .requiresAttributes, .compatibilities, .revision, .status, .registeredAt, .registeredBy)' current.json > task-definition.json

      - name: Setting the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ inputs.container }}
          image: ${{ steps.image.outputs.image }}
          environment-variables: ${{ inputs.container-env }}

      - name: Deploying the service
        id: service
        if: ${{ !inputs.task-definition-only }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ inputs.cluster }}
          service: ${{ inputs.ecs-service }}
          wait-for-service-stability: true
          wait-for-minutes: ${{ env.SERVICE_WAIT_MINUTES }}
          propagate-tags: SERVICE
          enable-ecs-managed-tags: true

      - name: Registering the task definition
        id: register
        if: inputs.task-definition-only
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ inputs.cluster }}
