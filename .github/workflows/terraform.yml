# Runs Terraform in CI. mode: plan checks the code, plans, and posts the plan
# on the pull request. mode: apply plans and applies in the given GitHub
# environment; a person starts it, a merge never does. See the README for an
# example call.
#
# Every secret whose name starts with TF_VAR_ becomes a Terraform variable:
# the secret TF_VAR_CMI_RDS_PASSWORD sets the variable cmi_rds_password. Call
# this workflow with secrets: inherit.
#
# The caller grants contents: read and id-token: write, and pull-requests:
# write for a plan on a pull request.
name: Terraform

on:
  workflow_call:
    inputs:
      mode:
        description: plan or apply.
        type: string
        required: true
      working-directory:
        type: string
        default: tf
      terraform-version:
        type: string
        default: 1.14.8
      aws-region:
        type: string
        default: us-east-1
      aws-role:
        description: The role to assume. Use a read-only role for plans on pull requests.
        type: string
        required: true
      environment:
        description: The GitHub environment of an apply.
        type: string
        default: production
      gcp-service-account:
        description: A GCP service account to sign in as, through the GCP_WORKLOAD_POOL secret. Empty means no GCP.
        type: string
        default: ""
    secrets:
      GCP_WORKLOAD_POOL:
        required: false

jobs:
  plan:
    name: Plan
    if: inputs.mode == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checking out the code
        uses: actions/checkout@v7

      # A secret value can hold any character, so each one is written with
      # its own random delimiter.
      - name: Turning the TF_VAR_ secrets into variables
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          while IFS= read -r key; do
            name="TF_VAR_$(tr '[:upper:]' '[:lower:]' <<< "${key#TF_VAR_}")"
            delimiter="EOF_$(openssl rand -hex 16)"
            {
              echo "$name<<$delimiter"
              jq -r --arg k "$key" '.[$k]' <<< "$SECRETS"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          done < <(jq -r 'keys[] | select(startswith("TF_VAR_"))' <<< "$SECRETS")

      - name: Configuring AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.aws-role }}

      - name: Configuring GCP credentials
        if: inputs.gcp-service-account != ''
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ inputs.gcp-service-account }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_POOL }}

      - name: Setting up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Initializing
        run: terraform init -input=false

      - name: Checking the format
        run: terraform fmt -check

      - name: Validating
        run: terraform validate

      - name: Planning
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=plan.out
          terraform show -no-color plan.out > plan.txt

      # GitHub cuts a comment at 65536 characters, so a long plan is cut and
      # the comment says where the whole plan is.
      - name: Posting the plan on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary=$(grep -E '^(Plan:|No changes\.)' plan.txt | tail -1)
          {
            echo "#### Terraform plan: ${summary:-see the run}"
            echo
            echo "<details><summary>Plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo
            echo "</details>"
            echo
            if [[ $(wc -c < plan.txt) -gt 60000 ]]; then
              echo "The plan is longer than this comment. The whole plan is in [the run]($RUN)."
            fi
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

  apply:
    name: Apply
    if: inputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-apply-${{ github.repository }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checking out the code
        uses: actions/checkout@v7

      - name: Turning the TF_VAR_ secrets into variables
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          while IFS= read -r key; do
            name="TF_VAR_$(tr '[:upper:]' '[:lower:]' <<< "${key#TF_VAR_}")"
            delimiter="EOF_$(openssl rand -hex 16)"
            {
              echo "$name<<$delimiter"
              jq -r --arg k "$key" '.[$k]' <<< "$SECRETS"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          done < <(jq -r 'keys[] | select(startswith("TF_VAR_"))' <<< "$SECRETS")

      - name: Configuring AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ inputs.aws-role }}

      - name: Configuring GCP credentials
        if: inputs.gcp-service-account != ''
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ inputs.gcp-service-account }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_POOL }}

      - name: Setting up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Initializing
        run: terraform init -input=false

      - name: Planning
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=plan.out
          {
            echo '### Terraform plan'
            echo '```'
            terraform show -no-color plan.out | head -c 900000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Applying
        run: terraform apply -input=false -no-color -lock-timeout=5m plan.out
