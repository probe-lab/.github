# Checks this repo: lints every workflow and template, and builds a small
# image with the shared image workflow. The deploy and release workflows need
# AWS, so only actionlint checks them.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checking out the code
        uses: actions/checkout@v7

      - name: Setting up just
        uses: extractions/setup-just@v4

      - name: Linting the workflows and templates
        run: just lint
