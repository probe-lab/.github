# Checks this repo: lints every workflow and template, and builds a small
# image with the shared image workflow. The deploy and release workflows need
# AWS, so only actionlint checks them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checking out the code
        uses: actions/checkout@v7

      - name: Setting up just
        uses: extractions/setup-just@v4

      - name: Installing actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Linting the workflows and templates
        run: just lint

  image:
    name: Building the fixture image
    uses: ./.github/workflows/image.yml
    with:
      service: fixture
      dockerfile: tests/image/Dockerfile

  ci-ok:
    name: ci-ok
    if: always()
    needs: [actionlint, image]
    runs-on: ubuntu-latest
    steps:
      - name: Checking that every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
