# Lints and tests a Python repo that uses uv and just, so CI does what a
# person does locally. See the README for an example call.
name: Python

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          The runner label. Empty means the RUNNER_LABEL variable, then
          ubuntu-latest. Public repos pass ubuntu-latest.
        type: string
        default: ""
      working-directory:
        description: The folder with pyproject.toml, .python-version and the justfile.
        type: string
        default: "."
      lfs:
        description: Checks out Git LFS files too.
        type: boolean
        default: false
      uv-version:
        description: The uv version. Empty means the version that pyproject.toml asks for, or the newest.
        type: string
        default: ""
      sync-command:
        type: string
        default: uv sync --locked
      lint-command:
        type: string
        default: just lint
      test-command:
        type: string
        default: just test
      clickhouse:
        description: >-
          Starts a ClickHouse server for the tests. The test command gets
          CLICKHOUSE_HOST, CLICKHOUSE_PORT (native protocol),
          CLICKHOUSE_HTTP_PORT, CLICKHOUSE_USER, CLICKHOUSE_PASSWORD and
          CLICKHOUSE_DATABASE.
        type: boolean
        default: false
      clickhouse-image:
        type: string
        default: clickhouse/clickhouse-server:24.12
      clickhouse-user:
        type: string
        default: test
      clickhouse-password:
        type: string
        default: test
      clickhouse-database:
        type: string
        default: test
      timeout-minutes:
        type: number
        default: 30

jobs:
  check:
    name: Lint and test
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      clickhouse:
        # An empty image starts no service.
        image: ${{ inputs.clickhouse && inputs.clickhouse-image || '' }}
        # Docker picks free host ports, because several jobs can share one
        # self-hosted machine.
        ports:
          - 9000
          - 8123
        env:
          CLICKHOUSE_USER: ${{ inputs.clickhouse-user }}
          CLICKHOUSE_PASSWORD: ${{ inputs.clickhouse-password }}
          CLICKHOUSE_DB: ${{ inputs.clickhouse-database }}
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checking out the code
        uses: actions/checkout@v6
        with:
          lfs: ${{ inputs.lfs }}

      # A self-hosted runner keeps the uv cache on its disk, so only
      # GitHub-hosted runners use the GitHub cache.
      - name: Setting up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ inputs.uv-version }}
          enable-cache: ${{ runner.environment == 'github-hosted' }}
          working-directory: ${{ inputs.working-directory }}

      - name: Setting up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ${{ inputs.working-directory }}/.python-version

      - name: Setting up just
        uses: extractions/setup-just@v3

      - name: Installing the dependencies
        id: sync
        run: ${{ inputs.sync-command }}

      - name: Linting
        run: ${{ inputs.lint-command }}

      # Runs after a failed lint too, so one run reports both.
      - name: Testing
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['9000'] }}
          CLICKHOUSE_HTTP_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: ${{ inputs.clickhouse-user }}
          CLICKHOUSE_PASSWORD: ${{ inputs.clickhouse-password }}
          CLICKHOUSE_DATABASE: ${{ inputs.clickhouse-database }}
        run: ${{ inputs.test-command }}
