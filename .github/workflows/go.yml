# Lints and tests a Go repo with its own just recipes, so CI does what a
# person does locally. See the README for an example call.
name: Go

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          The runner label. Empty means the RUNNER_LABEL variable, then
          ubuntu-latest. Public repos pass ubuntu-latest.
        type: string
        default: ""
      working-directory:
        description: The folder with go.mod and the justfile.
        type: string
        default: "."
      go-tools:
        description: >-
          Tools to install with go install before the lint, separated by
          spaces, for example mvdan.cc/gofumpt@v0.12.0.
        type: string
        default: ""
      golangci-lint:
        description: >-
          Installs this golangci-lint version before the lint, for example
          v2.15. The lint command runs it. Empty means no golangci-lint.
        type: string
        default: ""
      lint-command:
        type: string
        default: just lint
      test-command:
        type: string
        default: just test
      clickhouse:
        description: >-
          Starts a ClickHouse server for the tests. The test command gets
          CLICKHOUSE_HOST, CLICKHOUSE_PORT (native protocol),
          CLICKHOUSE_HTTP_PORT, CLICKHOUSE_USER, CLICKHOUSE_PASSWORD and
          CLICKHOUSE_DATABASE.
        type: boolean
        default: false
      clickhouse-image:
        type: string
        default: clickhouse/clickhouse-server:24.12
      clickhouse-user:
        type: string
        default: test
      clickhouse-password:
        type: string
        default: test
      clickhouse-database:
        type: string
        default: test
      goreleaser-check:
        description: >-
          Also builds every release binary with goreleaser, without a
          release, so a change that breaks a release fails here.
        type: boolean
        default: false
      goprivate:
        description: >-
          Private modules, comma-separated, for example
          github.com/probe-lab/api. Needs the GO_PRIVATE_TOKEN secret.
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 30
    secrets:
      GO_PRIVATE_TOKEN:
        description: A token that can read the modules in goprivate.
        required: false

jobs:
  check:
    name: Lint and test
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      clickhouse:
        # An empty image starts no service.
        image: ${{ inputs.clickhouse && inputs.clickhouse-image || '' }}
        # Docker picks free host ports, because several jobs can share one
        # self-hosted machine.
        ports:
          - 9000
          - 8123
        env:
          CLICKHOUSE_USER: ${{ inputs.clickhouse-user }}
          CLICKHOUSE_PASSWORD: ${{ inputs.clickhouse-password }}
          CLICKHOUSE_DB: ${{ inputs.clickhouse-database }}
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checking out the code
        uses: actions/checkout@v7

      # A self-hosted runner keeps the Go caches on its disk, so only
      # GitHub-hosted runners use the GitHub cache.
      - name: Setting up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Setting up just
        uses: extractions/setup-just@v4

      # The git settings go into the job's environment, not into a file, so
      # the token does not stay on a self-hosted runner after the job.
      - name: Giving access to private Go modules
        if: inputs.goprivate != ''
        env:
          MODULES: ${{ inputs.goprivate }}
          TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          # Adds to git settings that the environment may already have.
          i=${GIT_CONFIG_COUNT:-0}
          for module in ${MODULES//,/ }; do
            echo "GIT_CONFIG_KEY_$i=url.https://x-access-token:${TOKEN}@${module}.insteadOf" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_VALUE_$i=https://${module}" >> "$GITHUB_ENV"
            i=$((i + 1))
          done
          echo "GIT_CONFIG_COUNT=$i" >> "$GITHUB_ENV"
          echo "GOPRIVATE=$MODULES" >> "$GITHUB_ENV"

      - name: Installing Go tools
        if: inputs.go-tools != ''
        env:
          TOOLS: ${{ inputs.go-tools }}
        run: |
          for tool in $TOOLS; do
            go install "$tool"
          done

      # Installs the release binary, because golangci-lint advises against
      # go install. It only installs; the lint command runs it.
      - name: Installing golangci-lint
        if: inputs.golangci-lint != ''
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint }}
          install-only: true
          working-directory: ${{ inputs.working-directory }}
          skip-cache: ${{ runner.environment != 'github-hosted' }}

      - name: Linting
        run: ${{ inputs.lint-command }}

      # Runs after a failed lint too, so one run reports both.
      - name: Testing
        if: ${{ !cancelled() }}
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['9000'] }}
          CLICKHOUSE_HTTP_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: ${{ inputs.clickhouse-user }}
          CLICKHOUSE_PASSWORD: ${{ inputs.clickhouse-password }}
          CLICKHOUSE_DATABASE: ${{ inputs.clickhouse-database }}
        run: ${{ inputs.test-command }}

  goreleaser:
    name: Release build
    if: inputs.goreleaser-check
    runs-on: ${{ inputs.runner || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      # The full history has the tags that go build reads the version from.
      - name: Checking out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setting up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Giving access to private Go modules
        if: inputs.goprivate != ''
        env:
          MODULES: ${{ inputs.goprivate }}
          TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: |
          # Adds to git settings that the environment may already have.
          i=${GIT_CONFIG_COUNT:-0}
          for module in ${MODULES//,/ }; do
            echo "GIT_CONFIG_KEY_$i=url.https://x-access-token:${TOKEN}@${module}.insteadOf" >> "$GITHUB_ENV"
            echo "GIT_CONFIG_VALUE_$i=https://${module}" >> "$GITHUB_ENV"
            i=$((i + 1))
          done
          echo "GIT_CONFIG_COUNT=$i" >> "$GITHUB_ENV"
          echo "GOPRIVATE=$MODULES" >> "$GITHUB_ENV"

      - name: Building the release binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
          workdir: ${{ inputs.working-directory }}
