# Builds a Docker image and pushes it to ECR as <service>-sha<commit>; a pull
# request also gets <service>-pr<number>. It pushes the image of a merge, of a
# manual run, and of a pull request with the label push-image. Any other pull
# request only builds the image, to check that it builds. See the README for
# an example call.
#
# A pull request with other labels does not run it again: the caller lists
# `labeled` in its pull_request types, and this workflow skips a labeled
# event of any other label. The image goes to the ProbeLab ECR repository, and
# the build runs on the RUNNER_LABEL runner when the repo has that variable.
# The caller grants id-token: write.
name: Image

on:
  workflow_call:
    inputs:
      service:
        description: The first part of every image tag, for example atlas.
        type: string
        required: true
      push:
        description: >-
          Pushes whatever the event is. Without it, the rules above decide.
        type: boolean
        default: false
      dockerfile:
        description: The Dockerfile, as a path from the repo root. The build context is the repo root.
        type: string
        default: Dockerfile
      build-args:
        description: Build arguments, one KEY=VALUE per line.
        type: string
        default: ""
      platforms:
        type: string
        default: linux/amd64
      commit:
        description: >-
          The commit to build, as a SHA, a branch or a tag. Empty means the
          commit of the event, or the head commit of a pull request.
        type: string
        default: ""
    outputs:
      image:
        description: The image with its commit tag, for example 0191.../probelab:atlas-sha1a2b3c4.
        value: ${{ jobs.build.outputs.image }}
      tag:
        description: The commit tag, for example atlas-sha1a2b3c4.
        value: ${{ jobs.build.outputs.tag }}

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::019120760881:role/prod-use1-github-oidc-role
  ECR_REGISTRY: 019120760881.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: probelab

jobs:
  build:
    name: Build
    # The label push-image on a pull request is the only other label that
    # starts a run.
    if: github.event.action != 'labeled' || github.event.label.name == 'push-image'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      PUSH: ${{ inputs.push || github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image') }}
    outputs:
      image: ${{ steps.tags.outputs.image }}
      tag: ${{ steps.tags.outputs.tag }}
    steps:
      # A pull request builds its head commit, not the merge commit, so the
      # tag names a commit that exists in the repo. The full history has the
      # tags that go build reads the version from.
      - name: Checking out the code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Computing the image tags
        id: tags
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The checked-out commit, so a branch name or a short SHA in the
          # commit input gives the same tag as the full SHA.
          SHA=$(git rev-parse HEAD)
          tag="$SERVICE-sha${SHA::7}"
          tags="$IMAGE:$tag"
          if [[ -n "$PR" ]]; then
            tags="$tags,$IMAGE:$SERVICE-pr$PR"
          fi
          {
            echo "tag=$tag"
            echo "image=$IMAGE:$tag"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - name: Configuring AWS credentials
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE }}

      - name: Logging in to Amazon ECR
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Checking if the image exists
        id: exists
        if: env.PUSH == 'true' && github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "$TAG exists. Nothing to build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # A self-hosted runner builds in its own Docker, which keeps the build
      # cache between jobs. A GitHub-hosted runner keeps docker-container,
      # because its Docker may not build several platforms with the docker
      # driver.
      - name: Setting up Docker Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver: ${{ runner.environment == 'self-hosted' && 'docker' || 'docker-container' }}

      - name: Building the image
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
