# Publishes a release for a version tag such as v1.2.3 or v1.2.3-rc.1: the
# GitHub release with notes from the "## [1.2.3]" section of CHANGELOG.md, and
# an optional ECR image. A tag with -rc.N becomes a pre-release. It fails
# unless the tagged commit passed the check "Checking the code" on the default
# branch, so a repo does not run its checks again. See the README for an example call.
#
# The repo's .goreleaser.yaml, if there is one, builds and attaches the
# binaries; a release candidate is a pre-release when it sets
# release.prerelease to auto. Releases hold write credentials, so every job
# runs on a GitHub-hosted runner. The caller grants contents: write,
# checks: read, and id-token: write when it pushes an image to ECR.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to release, for example v1.2.3.
        type: string
        required: true
      ecr-service:
        description: >-
          Pushes an image to ECR as <ecr-service>-1.2.3, and as
          <ecr-service>-latest for a final release. Empty means no image.
        type: string
        default: ""
      platforms:
        type: string
        default: linux/amd64,linux/arm64

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::019120760881:role/prod-use1-github-oidc-role
  ECR_REGISTRY: 019120760881.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: probelab

jobs:
  prepare:
    name: Checking the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checking the tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not a release tag like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # The checks ran when the commit was merged. A tag on a commit that
      # never passed them is a mistake, so the release stops here.
      - name: Checking that CI passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          result=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=Checking%20the%20code" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [[ "$result" == "0" ]]; then
            echo "::error::The commit ${sha::7} has no passing 'Checking the code' check. Merge it through a pull request, wait for CI, and tag again."
            exit 1
          fi

  github-release:
    name: GitHub release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checking out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Taking the notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          section() {
            awk -v head="## [$1]" 'index($0, head) == 1 { p = 1; next } /^## \[/ || /^\[[^]]+\]: / { p = 0 } p' CHANGELOG.md
          }
          notes=$(section "$VERSION")
          # A release candidate uses the section of the version it leads to.
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            notes=$(section "${VERSION%%-*}")
          fi
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "::error::CHANGELOG.md has no section \"## [$VERSION]\"."
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"

      - name: Looking for a goreleaser configuration
        id: goreleaser
        run: |
          if compgen -G ".goreleaser.y*ml" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setting up Go
        if: steps.goreleaser.outputs.found == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Releasing with goreleaser
        if: steps.goreleaser.outputs.found == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Making the GitHub release
        if: steps.goreleaser.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

  image:
    name: ECR image
    needs: prepare
    if: inputs.ecr-service != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # go build reads the version from the tag.
      - name: Checking out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Computing the image tags
        id: tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          SERVICE: ${{ inputs.ecr-service }}
        run: |
          tags="$IMAGE:$SERVICE-$VERSION"
          if [[ "$PRERELEASE" != "true" ]]; then
            tags="$tags,$IMAGE:$SERVICE-latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Configuring AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE }}

      - name: Logging in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setting up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setting up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Building and pushing the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
